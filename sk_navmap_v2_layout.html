<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SK 항법지도 2.0 — UI 구성안</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --sk-red:#E8001C; --sk-orange:#FF6B00;
  --bg:#0a0e14; --panel:#111720; --card:#0d1520;
  --border:#1e2d40; --text:#c8dff0; --dim:#4a6a85;
  --green:#00cc66; --blue:#00c8ff; --gold:#FFD700;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden;user-select:none}

/* ── 화면 전환 ── */
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ══════════════════════════
   메인 지도 화면
══════════════════════════ */
#screen-map .map-bg{
  flex:1;position:relative;
  background:linear-gradient(160deg,#0d1f30 0%,#0a1828 50%,#0d2035 100%);
  overflow:hidden;
}
/* 지도 격자 (위성지도 플레이스홀더) */
.map-grid{position:absolute;inset:0;opacity:0.06;
  background-image:linear-gradient(#00c8ff 1px,transparent 1px),linear-gradient(90deg,#00c8ff 1px,transparent 1px);
  background-size:44px 44px}
.map-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(0,200,255,0.2);font-size:13px;letter-spacing:3px;text-align:center;line-height:2}

/* 마커들 */
.mk{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform 0.15s}
.mk:active{transform:translate(-50%,-50%) scale(1.2)}
.mk-h{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:15px;border:2.5px solid rgba(255,255,255,0.4);
  box-shadow:0 3px 12px rgba(0,0,0,0.5)}
.mk.sk .mk-h{background:var(--sk-red)}
.mk.land .mk-h{background:#00aa55}

/* 경로 SVG */
.route-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route-line{stroke:#00cc66;stroke-width:1.5;fill:none;opacity:0.6}
.route-selected{stroke:var(--sk-orange);stroke-width:4;fill:none;opacity:0.95}

/* ── 상단 상태바 ── */
.top-bar{
  position:absolute;top:0;left:0;right:0;z-index:50;
  padding:10px 14px 8px;
  background:linear-gradient(to bottom,rgba(10,14,20,0.9) 0%,transparent 100%);
}
.top-inner{display:flex;align-items:center;gap:10px}
.logo{font-size:16px;font-weight:800}
.logo .sk{color:var(--sk-red)}
.logo .nav{color:var(--text);font-weight:400;font-size:13px}
.top-spacer{flex:1}
.top-btn{background:rgba(13,21,32,0.85);border:1px solid var(--border);border-radius:10px;
  color:var(--text);padding:7px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;backdrop-filter:blur(8px)}

/* ── 결과 칩 (경로 선택 시) ── */
.result-bar{
  position:absolute;top:52px;left:0;right:0;z-index:49;
  padding:0 14px;display:flex;gap:6px;flex-wrap:wrap;
  transform:translateY(-60px);opacity:0;
  transition:all 0.3s cubic-bezier(0.32,0.72,0,1);
}
.result-bar.show{transform:translateY(0);opacity:1}
.chip{background:rgba(13,21,32,0.9);border:1px solid rgba(0,200,255,0.25);
  border-radius:20px;padding:5px 12px;font-size:12px;backdrop-filter:blur(8px);white-space:nowrap}
.chip b{margin-left:3px}
.chip .v-blue{color:var(--blue)}
.chip .v-green{color:var(--green)}
.chip .v-orange{color:var(--sk-orange)}

/* ── 하단 액션바 ── */
.bottom-bar{
  position:absolute;bottom:0;left:0;right:0;z-index:50;
  padding:0 16px calc(var(--safe-bottom) + 12px);
  background:linear-gradient(to top,rgba(10,14,20,0.95) 0%,transparent 100%);
  padding-top:20px;
}
.action-row{display:flex;gap:10px;align-items:flex-end}
.action-main{
  flex:1;background:rgba(13,21,32,0.92);border:1px solid var(--border);
  border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;
  cursor:pointer;backdrop-filter:blur(12px);
}
.action-main-icon{font-size:20px}
.action-main-text{flex:1}
.action-main-title{font-size:13px;font-weight:700;color:var(--text)}
.action-main-sub{font-size:11px;color:var(--dim);margin-top:1px}
.action-main-arrow{color:var(--dim);font-size:18px}

.action-fab{
  width:52px;height:52px;border-radius:16px;border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;flex-shrink:0;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:transform 0.15s;
}
.action-fab:active{transform:scale(0.92)}
.fab-route{background:var(--sk-orange)}
.fab-add{background:var(--panel);border:1px solid var(--border);color:var(--text)}

/* ══════════════════════════
   경로 검색 시트
══════════════════════════ */
.sheet{
  position:fixed;inset:0;z-index:200;pointer-events:none;
}
.sheet-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0);
  transition:background 0.3s;pointer-events:none;
}
.sheet.open .sheet-overlay{background:rgba(0,0,0,0.5);pointer-events:auto}
.sheet-panel{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--border);
  transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
  max-height:85vh;display:flex;flex-direction:column;
  pointer-events:auto;
}
.sheet.open .sheet-panel{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 4px}
.sheet-title{font-size:16px;font-weight:700;padding:4px 18px 12px;color:#fff}

/* 경로 검색 */
.search-wrap{padding:0 14px 10px;position:relative}
.search-input{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-size:14px;padding:11px 40px 11px 14px;
  outline:none;-webkit-appearance:none;
}
.search-input:focus{border-color:var(--blue)}
.search-icon{position:absolute;right:26px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:16px}

/* 탭 */
.tab-row{display:flex;padding:0 14px 8px;gap:8px;overflow-x:auto;scrollbar-width:none}
.tab-row::-webkit-scrollbar{display:none}
.tab-pill{
  flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;border:1px solid var(--border);color:var(--dim);background:none;
  transition:all 0.15s;white-space:nowrap;
}
.tab-pill.active{background:var(--sk-orange);border-color:var(--sk-orange);color:#fff}

/* 경로 카드 */
.route-scroll{flex:1;overflow-y:auto;padding:0 14px;scrollbar-width:none}
.route-scroll::-webkit-scrollbar{display:none}
.route-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:border-color 0.15s;active:opacity:0.7;
}
.route-card:active{border-color:var(--sk-orange);background:rgba(255,107,0,0.05)}
.route-card.selected{border-color:var(--sk-orange);background:rgba(255,107,0,0.08)}
.rc-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,107,0,0.15);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rc-info{flex:1;min-width:0}
.rc-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-dep-arr{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-dep-arr span{color:var(--blue)}
.rc-stats{text-align:right;flex-shrink:0}
.rc-dist{font-size:13px;font-weight:700;color:var(--sk-orange)}
.rc-time{font-size:10px;color:var(--dim);margin-top:2px}

/* 즐겨찾기 별 */
.rc-fav{background:none;border:none;font-size:18px;color:var(--dim);cursor:pointer;padding:4px;flex-shrink:0}
.rc-fav.on{color:var(--gold)}

/* 바텀 패딩 */
.sheet-bottom{height:calc(var(--safe-bottom) + 8px);flex-shrink:0}

/* ══════════════════════════
   마커 탭 시트
══════════════════════════ */
.marker-sheet .sheet-panel{max-height:60vh}
.marker-header{padding:4px 18px 14px;display:flex;align-items:flex-start;justify-content:space-between}
.marker-name{font-size:18px;font-weight:800;color:#fff}
.marker-type{font-size:11px;color:var(--dim);margin-top:3px}
.close-btn{background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:50%;
  color:var(--dim);width:30px;height:30px;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fms-row{
  margin:0 18px 14px;background:rgba(255,107,0,0.08);
  border:1px solid rgba(255,107,0,0.25);border-radius:12px;
  padding:10px 14px;display:flex;align-items:center;gap:12px;
}
.fms-item{flex:1}
.fms-label{font-size:9px;color:var(--dim);letter-spacing:0.5px;margin-bottom:2px}
.fms-val{font-size:15px;font-family:monospace;font-weight:700;color:var(--sk-orange)}
.fms-copy{background:rgba(255,107,0,0.15);border:1px solid rgba(255,107,0,0.3);
  border-radius:8px;color:var(--sk-orange);font-size:11px;padding:6px 12px;cursor:pointer;white-space:nowrap}

.related-title{font-size:10px;color:var(--dim);letter-spacing:1px;padding:0 18px 8px;border-top:1px solid var(--border);padding-top:12px}
.related-scroll{overflow-x:auto;padding:0 14px;scrollbar-width:none;display:flex;gap:8px}
.related-scroll::-webkit-scrollbar{display:none}
.related-chip{
  flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;cursor:pointer;min-width:120px;
  transition:border-color 0.15s;
}
.related-chip:active{border-color:var(--sk-orange)}
.related-dir{font-size:10px;color:var(--dim);margin-bottom:3px}
.related-dest{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap}
.related-time{font-size:11px;color:var(--green);margin-top:2px}

/* ══════════════════════════
   + 추가 메뉴
══════════════════════════ */
.add-menu .sheet-panel{max-height:50vh}
.add-menu-list{padding:0 14px 8px}
.add-menu-item{
  display:flex;align-items:center;gap:14px;padding:14px 4px;
  border-bottom:1px solid var(--border);cursor:pointer;
  transition:opacity 0.15s;
}
.add-menu-item:last-child{border-bottom:none}
.add-menu-item:active{opacity:0.6}
.add-menu-icon{width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ami-green{background:rgba(0,200,100,0.12);border:1px solid rgba(0,200,100,0.25)}
.ami-orange{background:rgba(255,107,0,0.12);border:1px solid rgba(255,107,0,0.25)}
.ami-blue{background:rgba(0,200,255,0.12);border:1px solid rgba(0,200,255,0.25)}
.add-menu-text{}
.add-menu-name{font-size:14px;font-weight:700;color:var(--text)}
.add-menu-desc{font-size:11px;color:var(--dim);margin-top:2px}
.add-menu-arrow{margin-left:auto;color:var(--dim);font-size:18px}

/* ══════════════════════════
   데모 컨트롤
══════════════════════════ */
.demo-controls{
  position:fixed;top:10px;right:10px;z-index:999;
  display:flex;flex-direction:column;gap:6px;
}
.demo-btn{
  background:rgba(13,21,32,0.95);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:11px;padding:6px 10px;
  cursor:pointer;white-space:nowrap;text-align:center;
}
.demo-btn.active-btn{border-color:var(--sk-orange);color:var(--sk-orange)}
.demo-label{font-size:9px;color:var(--dim);text-align:center;letter-spacing:1px;padding:2px 0}
</style>
</head>
<body>

<!-- 메인 지도 화면 -->
<div id="screen-map" class="screen active">

  <!-- 지도 배경 -->
  <div class="map-bg">
    <div class="map-grid"></div>
    <div class="map-label">🛰️ 구글 위성지도<br>실제 구현 시 표시됩니다</div>

    <!-- 경로 SVG -->
    <svg class="route-svg" id="route-svg">
      <path class="route-line" d="M 80,180 L 160,220 L 280,160"/>
      <path class="route-line" d="M 160,220 L 260,300 L 340,280"/>
      <path class="route-line" d="M 80,180 L 200,120 L 360,100"/>
      <path class="route-selected" id="selected-route" d="" style="display:none"/>
    </svg>

    <!-- 마커들 -->
    <div class="mk sk" style="left:80px;top:180px" onclick="showMarkerSheet('만남의 광장 헬기장','SK착륙장',37.461511,127.040522)">
      <div class="mk-h">H</div>
    </div>
    <div class="mk sk" style="left:160px;top:220px" onclick="showMarkerSheet('김포공항','SK착륙장',37.553469,126.789136)">
      <div class="mk-h">H</div>
    </div>
    <div class="mk land" style="left:280px;top:160px" onclick="showMarkerSheet('SK바이오사이언스(안동)','착륙장',36.566667,128.716667)">
      <div class="mk-h">H</div>
    </div>
    <div class="mk land" style="left:340px;top:280px" onclick="showMarkerSheet('울산 SK케미칼','착륙장',35.467167,129.353500)">
      <div class="mk-h">H</div>
    </div>
    <div class="mk land" style="left:200px;top:120px" onclick="showMarkerSheet('강릉기지(RKNN)','착륙장',37.752,128.944)">
      <div class="mk-h">H</div>
    </div>
    <div class="mk sk" style="left:260px;top:300px" onclick="showMarkerSheet('이천 SK하이닉스','SK착륙장',37.246823,127.477440)">
      <div class="mk-h">H</div>
    </div>
  </div>

  <!-- 상단 바 -->
  <div class="top-bar">
    <div class="top-inner">
      <div class="logo">🚁 <span class="sk">SK</span> <span class="nav">항법지도</span></div>
      <div class="top-spacer"></div>
      <button class="top-btn" onclick="toggleLayer()">🗺️ 레이어</button>
    </div>
  </div>

  <!-- 결과 칩 -->
  <div class="result-bar" id="result-bar">
    <div class="chip">거리 <b class="v-blue" id="r-dist">—</b> NM</div>
    <div class="chip">130KTS <b class="v-green" id="r-130">—</b>분</div>
    <div class="chip">140KTS <b class="v-blue" id="r-140">—</b>분</div>
    <div class="chip">연료 <b class="v-orange" id="r-fuel">—</b> LBS</div>
  </div>

  <!-- 하단 액션바 -->
  <div class="bottom-bar">
    <div class="action-row">
      <div class="action-main" onclick="openSheet('route-sheet')">
        <div class="action-main-icon">🗂️</div>
        <div class="action-main-text">
          <div class="action-main-title" id="route-display">항법경로 선택</div>
          <div class="action-main-sub" id="route-sub">출발지 · 도착지를 선택하세요</div>
        </div>
        <div class="action-main-arrow">›</div>
      </div>
      <button class="action-fab fab-add" onclick="openSheet('add-menu')">＋</button>
    </div>
  </div>
</div>

<!-- ── 경로 검색 시트 ── -->
<div class="sheet" id="route-sheet">
  <div class="sheet-overlay" onclick="closeSheet('route-sheet')"></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-title">항법경로 검색</div>
    <div class="search-wrap">
      <input class="search-input" placeholder="경로명, 출발지, 도착지 검색..." oninput="filterRoutes(this.value)">
      <span class="search-icon">🔍</span>
    </div>
    <div class="tab-row">
      <button class="tab-pill active" onclick="setTab('all',this)">전체</button>
      <button class="tab-pill" onclick="setTab('fav',this)">⭐ 즐겨찾기</button>
      <button class="tab-pill" onclick="setTab('mann',this)">만남 출발</button>
      <button class="tab-pill" onclick="setTab('rkss',this)">김포 출발</button>
    </div>
    <div class="route-scroll" id="route-list"></div>
    <div class="sheet-bottom"></div>
  </div>
</div>

<!-- ── 마커 탭 시트 ── -->
<div class="sheet marker-sheet" id="marker-sheet">
  <div class="sheet-overlay" onclick="closeSheet('marker-sheet')"></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="marker-header">
      <div>
        <div class="marker-name" id="m-name">—</div>
        <div class="marker-type" id="m-type">—</div>
      </div>
      <button class="close-btn" onclick="closeSheet('marker-sheet')">✕</button>
    </div>
    <div class="fms-row">
      <div class="fms-item">
        <div class="fms-label">LAT</div>
        <div class="fms-val" id="m-lat">—</div>
      </div>
      <div class="fms-item">
        <div class="fms-label">LNG</div>
        <div class="fms-val" id="m-lng">—</div>
      </div>
      <button class="fms-copy" onclick="copyFms()">📋 복사</button>
    </div>
    <div class="related-title">관련 항법경로</div>
    <div class="related-scroll" id="related-routes"></div>
    <div class="sheet-bottom"></div>
  </div>
</div>

<!-- ── + 추가 메뉴 ── -->
<div class="sheet add-menu" id="add-menu">
  <div class="sheet-overlay" onclick="closeSheet('add-menu')"></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-title">추가하기</div>
    <div class="add-menu-list">
      <div class="add-menu-item" onclick="closeSheet('add-menu');alert('지도를 탭해서 경유점을 추가하세요')">
        <div class="add-menu-icon ami-orange">✈️</div>
        <div class="add-menu-text">
          <div class="add-menu-name">새 항법경로</div>
          <div class="add-menu-desc">출발~경유~도착 경로 작성</div>
        </div>
        <div class="add-menu-arrow">›</div>
      </div>
      <div class="add-menu-item" onclick="closeSheet('add-menu');alert('착륙장 정보를 입력하세요')">
        <div class="add-menu-icon ami-green">🅗</div>
        <div class="add-menu-text">
          <div class="add-menu-name">착륙장 추가</div>
          <div class="add-menu-desc">새 헬기장 또는 착륙지점</div>
        </div>
        <div class="add-menu-arrow">›</div>
      </div>
      <div class="add-menu-item" onclick="closeSheet('add-menu');alert('WayPoint 정보를 입력하세요')">
        <div class="add-menu-icon ami-blue">📍</div>
        <div class="add-menu-text">
          <div class="add-menu-name">WayPoint 추가</div>
          <div class="add-menu-desc">항법 경유점 등록</div>
        </div>
        <div class="add-menu-arrow">›</div>
      </div>
    </div>
    <div class="sheet-bottom"></div>
  </div>
</div>

<!-- 데모 컨트롤 -->
<div class="demo-controls">
  <div class="demo-label">UI 미리보기</div>
  <button class="demo-btn active-btn" onclick="showDemo('map')">🗺️ 지도</button>
  <button class="demo-btn" onclick="showDemo('route')">🗂️ 경로검색</button>
  <button class="demo-btn" onclick="showDemo('marker')">📍 마커탭</button>
  <button class="demo-btn" onclick="showDemo('add')">➕ 추가메뉴</button>
  <button class="demo-btn" onclick="showDemo('result')">📊 결과표시</button>
</div>

<script>
var ROUTES = [
  {name:'MANN-SKCM 만남-울산',dep:'만남의 광장 헬기장',arr:'울산 SK케미칼',dist:178.4,t130:82.3,t140:76.5,fuel:823,fav:true},
  {name:'MANN-ADSKC 만남-안동',dep:'만남의 광장 헬기장',arr:'SK바이오사이언스(안동)',dist:108.7,t130:50.2,t140:46.6,fuel:503,fav:true},
  {name:'MANN 김포-만남',dep:'김포공항',arr:'만남의 광장 헬기장',dist:24.0,t130:11.1,t140:10.3,fuel:111,fav:false},
  {name:'RKSS-SKCM 김포-울산',dep:'김포공항',arr:'울산 SK케미칼',dist:200.0,t130:92.3,t140:85.7,fuel:926,fav:false},
  {name:'MANN-SKRE 만남-대덕',dep:'만남의 광장 헬기장',arr:'대덕 SK연구소',dist:65.2,t130:30.1,t140:27.9,fuel:301,fav:false},
  {name:'RKSS-RKPK 김포-김해',dep:'김포공항',arr:'김해공항',dist:200.0,t130:92.3,t140:85.7,fuel:926,fav:false},
];

var currentTab='all', favs={};
var currentMarker=null;

function openSheet(id){
  document.getElementById(id).classList.add('open');
  if(id==='route-sheet') renderRoutes('');
}
function closeSheet(id){ document.getElementById(id).classList.remove('open'); }

function setTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.tab-pill').forEach(function(b){b.classList.remove('active')});
  el.classList.add('active');
  renderRoutes(document.querySelector('.search-input')?.value||'');
}

function filterRoutes(q){ renderRoutes(q); }

function renderRoutes(q){
  q=(q||'').toLowerCase();
  var list=ROUTES.filter(function(r){
    var matchTab=currentTab==='all'||(currentTab==='fav'&&favs[r.name])||(currentTab==='mann'&&r.dep.includes('만남'))||(currentTab==='rkss'&&r.dep.includes('김포'));
    var matchQ=!q||r.name.toLowerCase().includes(q)||r.dep.toLowerCase().includes(q)||r.arr.toLowerCase().includes(q);
    return matchTab&&matchQ;
  });
  document.getElementById('route-list').innerHTML=list.map(function(r){
    var isFav=!!favs[r.name];
    return '<div class="route-card" onclick="selectRoute(\''+r.name+'\',\''+r.dep+'\',\''+r.arr+'\','+r.dist+','+r.t130+','+r.t140+','+r.fuel+')">'
      +'<div class="rc-icon">✈️</div>'
      +'<div class="rc-info">'
        +'<div class="rc-name">'+r.name+'</div>'
        +'<div class="rc-dep-arr"><span>'+r.dep+'</span> → <span>'+r.arr+'</span></div>'
      +'</div>'
      +'<div class="rc-stats">'
        +'<div class="rc-dist">'+r.dist+'NM</div>'
        +'<div class="rc-time">'+r.t130+'분</div>'
      +'</div>'
      +'<button class="rc-fav'+(isFav?' on':'')+'" onclick="toggleFav(event,\''+r.name+'\')">'+(isFav?'⭐':'☆')+'</button>'
    +'</div>';
  }).join('');
}

function toggleFav(e,name){ e.stopPropagation(); favs[name]=!favs[name]; renderRoutes(''); }

function selectRoute(name,dep,arr,dist,t130,t140,fuel){
  closeSheet('route-sheet');
  document.getElementById('route-display').textContent=dep+' → '+arr;
  document.getElementById('route-sub').textContent=dist+'NM · '+t130+'분 · 연료 '+fuel+'LBS';
  document.getElementById('r-dist').textContent=dist;
  document.getElementById('r-130').textContent=t130;
  document.getElementById('r-140').textContent=t140;
  document.getElementById('r-fuel').textContent=fuel;
  document.getElementById('result-bar').classList.add('show');
  // 오렌지 경로 표시 (데모)
  var paths={
    'MANN-SKCM 만남-울산':'M 80,180 L 200,250 L 340,280',
    'MANN-ADSKC 만남-안동':'M 80,180 L 160,220 L 280,160',
    'MANN 김포-만남':'M 160,220 L 120,200 L 80,180',
  };
  var svg=document.getElementById('selected-route');
  svg.setAttribute('d',paths[name]||'M 80,180 L 280,160');
  svg.style.display='block';
}

function toFms(lat,lng){
  var ld=lat>=0?'N':'S',la=Math.abs(lat),laDeg=Math.floor(la),laMin=((la-laDeg)*60).toFixed(2);
  var lo=lng>=0?'E':'W',lo2=Math.abs(lng),loDeg=Math.floor(lo2),loMin=((lo2-loDeg)*60).toFixed(2);
  return{lat:ld+String(laDeg).padStart(2,'0')+laMin.padStart(5,'0'),lng:lo+String(loDeg).padStart(3,'0')+loMin.padStart(5,'0')};
}

function showMarkerSheet(name,type,lat,lng){
  currentMarker={name,lat,lng};
  document.getElementById('m-name').textContent=name;
  document.getElementById('m-type').textContent=type;
  var fms=toFms(lat,lng);
  document.getElementById('m-lat').textContent=fms.lat;
  document.getElementById('m-lng').textContent=fms.lng;
  var related=ROUTES.filter(function(r){return r.dep===name||r.arr===name;});
  document.getElementById('related-routes').innerHTML=related.map(function(r){
    var other=r.dep===name?r.arr:r.dep;
    var dir=r.dep===name?'→':'←';
    return '<div class="related-chip" onclick="selectRoute(\''+r.name+'\',\''+r.dep+'\',\''+r.arr+'\','+r.dist+','+r.t130+','+r.t140+','+r.fuel+');closeSheet(\'marker-sheet\')">'
      +'<div class="related-dir">'+dir+'</div>'
      +'<div class="related-dest">'+other+'</div>'
      +'<div class="related-time">'+r.t130+'분 / '+r.fuel+'LBS</div>'
    +'</div>';
  }).join('')||'<div style="color:var(--dim);font-size:12px;padding:8px 4px">등록된 경로 없음</div>';
  openSheet('marker-sheet');
}

function copyFms(){
  var txt=document.getElementById('m-lat').textContent+' '+document.getElementById('m-lng').textContent;
  navigator.clipboard.writeText(txt).catch(function(){});
  event.target.textContent='✅ 복사됨';
  setTimeout(function(){event.target.textContent='📋 복사'},1500);
}

function toggleLayer(){alert('레이어 설정\n\n☑ SK착륙장\n☑ 착륙장\n☐ WayPoint\n☐ 항법경로');}

// 데모 컨트롤
function showDemo(type){
  document.querySelectorAll('.demo-btn').forEach(function(b){b.classList.remove('active-btn')});
  event.target.classList.add('active-btn');
  ['route-sheet','marker-sheet','add-menu'].forEach(function(id){closeSheet(id);});
  document.getElementById('result-bar').classList.remove('show');
  document.getElementById('selected-route').style.display='none';
  document.getElementById('route-display').textContent='항법경로 선택';
  document.getElementById('route-sub').textContent='출발지 · 도착지를 선택하세요';

  if(type==='route') openSheet('route-sheet');
  else if(type==='marker') showMarkerSheet('만남의 광장 헬기장','SK착륙장',37.461511,127.040522);
  else if(type==='add') openSheet('add-menu');
  else if(type==='result'){
    selectRoute('MANN-ADSKC 만남-안동','만남의 광장 헬기장','SK바이오사이언스(안동)',108.7,50.2,46.6,503);
  }
}
</script>
</body>
